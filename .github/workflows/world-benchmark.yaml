# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Benchmark test of the World Engine

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Go
      uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
      with:
        go-version: '1.25.4'

    - name: Test benchmark fixtures
      run: go test ./world -run '^(TestBenchmark|TestSequentialInsertBenchmarkCountLimit|TestParallelInsertBenchmarkCountLimit|TestParallelInsertAllocatorAssignsUniqueIndexes)' -count=1

    - name: Race-check World tests
      run: go test -race ./world

    - name: Run legacy World benchmarks with 1,2,4 CPUs
      run: go test ./world -run '^$' -bench '^BenchmarkWorld(Parallel)?$' -benchmem -benchtime=2s -cpu=1,2,4

    - name: Smoke-test bounded Save benchmarks (1,000 operations each)
      run: go test ./world -run '^$' -bench '^BenchmarkWorldSave$' -benchmem -benchtime=1000x -cpu=1,2
