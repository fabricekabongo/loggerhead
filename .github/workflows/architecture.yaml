name: Architecture dependencies

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: architecture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download pinned architecture checker
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 --max-time 60 \
            'https://github.com/fe3dback/go-arch-lint/releases/download/v1.19.0/go-arch-lint_1.19.0_linux_amd64.tar.gz' \
            --output "$RUNNER_TEMP/go-arch-lint.tar.gz"
          echo 'b4454546abf95ab1b32c26af146bc7c73ba3856c534d66890ac0738bada5a03c  '"$RUNNER_TEMP/go-arch-lint.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/go-arch-lint"
          tar -xzf "$RUNNER_TEMP/go-arch-lint.tar.gz" -C "$RUNNER_TEMP/go-arch-lint"
      - name: Enforce package dependencies
        shell: bash
        run: |
          "$RUNNER_TEMP/go-arch-lint/go-arch-lint" check --project-path . --arch-file .go-arch-lint.yml
